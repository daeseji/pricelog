name: 가격 업데이트

on:
  schedule:
    # 매일 한 번, 한국 시간 오전 9시 17분 (쿠팡 API 호출을 최소화)
    - cron: "17 0 * * *"
  workflow_dispatch:

# 수동 실행과 자동 실행이 겹쳐서 API를 두 배로 부르지 않도록 한 번에 하나만 실행
concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install requests

      - name: 가격 업데이트 실행
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python update_prices.py

      - name: 상품 사진 저장 (API 호출 없음)
        run: python save_images.py

      - name: 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add data/prices.json img
          git diff --staged --quiet || git commit -m "💰 가격 업데이트"
          git pull --rebase
          git push
