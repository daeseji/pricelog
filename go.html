<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>싸다구 · 쿠팡으로 이동 중</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#F6F5F0; --ink:#17171B; --muted:#8D8C94; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111113; --ink:#F4F3EE; --muted:#8E8D96; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
           font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; text-align:center; padding:0 16px; }
    img { width:64px; height:64px; animation: bob 1s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(-6px) rotate(-4deg); } }
    p { margin:16px 0 0; font-weight:700; font-size:16px; letter-spacing:-0.02em; }
    small { display:block; margin-top:6px; color:var(--muted); font-size:13px; }
    a { color:inherit; }
  </style>
</head>
<body>
  <div>
    <img src="favicon.svg" alt="">
    <p id="msg">쿠팡으로 이동 중이에요</p>
    <small id="sub">잠시만 기다려주세요</small>
  </div>
  <script>
    // go.html?u=<Base64> 형식의 제휴링크를 풀어서 쿠팡으로 이동합니다
    // (쿠팡 주소만 허용해서 다른 사이트로 악용되지 않게 막습니다)
    // go.html?wait=1 은 '내 상품'이 링크를 만드는 동안 잠깐 보여 주는 화면이에요
    const ALLOWED = ['link.coupang.com', 'www.coupang.com', 'coupang.com', 'm.coupang.com', 'coupa.ng'];
    // 검색 로봇, 링크 미리보기, 자동화 도구는 쿠팡으로 넘기지 않아요 (사람이 누르지 않은 클릭이 쌓이지 않게)
    const BOT = /bot\b|bot\/|crawler|spider|slurp|mediapartners|bingpreview|yeti\/|daum\/\d|kakaotalk-scrap|facebookexternalhit|embedly|headlesschrome|lighthouse|phantomjs|python-|curl\/|wget\//i;
    function decode(b64) {
      let s = b64.trim().replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return atob(s);
    }
    const params = new URLSearchParams(location.search);
    if (!params.has('wait')) {
      try {
        const target = new URL(decode(params.get('u') || ''));
        if (target.protocol !== 'https:' || !ALLOWED.includes(target.hostname)) throw new Error('not allowed');
        if (navigator.webdriver || BOT.test(navigator.userAgent)) {
          document.getElementById('msg').textContent = '쿠팡 상품 페이지로 연결되는 주소예요';
          const a = document.createElement('a');
          a.href = target.href;
          a.rel = 'nofollow sponsored noopener';
          a.textContent = '쿠팡에서 보기';
          const sub = document.getElementById('sub');
          sub.textContent = '';
          sub.appendChild(a);
        } else {
          location.replace(target.href);
        }
      } catch (e) {
        document.getElementById('msg').textContent = '링크가 올바르지 않아요';
        document.getElementById('sub').innerHTML = '<a href="./">싸다구로 돌아가기</a>';
      }
    }
  </script>
</body>
</html>
