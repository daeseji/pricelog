<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>싸다구 · 쿠팡으로 이동 중</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#F6F5F0; --ink:#17171B; --muted:#8D8C94; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111113; --ink:#F4F3EE; --muted:#8E8D96; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
           font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; text-align:center; padding:0 16px; }
    img { width:64px; height:64px; animation: bob 1s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(-6px) rotate(-4deg); } }
    p { margin:16px 0 0; font-weight:700; font-size:16px; letter-spacing:-0.02em; }
    small { display:block; margin-top:6px; color:var(--muted); font-size:13px; }
    a { color:inherit; }
  </style>
</head>
<body>
  <div>
    <img src="favicon.svg" alt="">
    <p id="msg">쿠팡으로 이동 중이에요</p>
    <small id="sub">잠시만 기다려주세요</small>
  </div>
  <script>
    // go.html?u=<Base64> 형식의 제휴링크를 풀어서 쿠팡으로 이동합니다
    // (쿠팡 주소만 허용해서 다른 사이트로 악용되지 않게 막습니다)
    const ALLOWED = ['link.coupang.com', 'www.coupang.com', 'coupang.com', 'm.coupang.com', 'coupa.ng'];
    function decode(b64) {
      let s = b64.trim().replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return atob(s);
    }
    try {
      const u = new URLSearchParams(location.search).get('u') || '';
      const target = new URL(decode(u));
      if (target.protocol !== 'https:' || !ALLOWED.includes(target.hostname)) throw new Error('not allowed');
      location.replace(target.href);
    } catch (e) {
      document.getElementById('msg').textContent = '링크가 올바르지 않아요';
      document.getElementById('sub').innerHTML = '<a href="./">싸다구로 돌아가기</a>';
    }
  </script>
</body>
</html>
