<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>pricelog</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #05050a;
      --s1: #0d0d15;
      --s2: #11111c;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.12);
      --text: #f0f0ff;
      --muted: #454566;
      --dim: #2a2a44;
      --green: #0dff9f;
      --green2: #00cc7a;
      --red: #ff2d6b;
      --yellow: #ffcc00;
      --blue: #4d9fff;
      --purple: #9b6fff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(77,159,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77,159,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow top */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(155,111,255,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      padding: 0 40px;
      height: 64px;
      background: rgba(5,5,10,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .logo-wrap { display: flex; align-items: center; gap: 10px; }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.5) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-tag {
      margin-left: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      padding: 3px 8px;
      border: 1px solid var(--dim);
      border-radius: 20px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .updated-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .updated-badge::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── MAIN ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px 80px;
      position: relative;
      z-index: 1;
    }

    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border2), transparent);
    }

    /* ── CARDS ── */
    .cards { display: flex; flex-direction: column; gap: 20px; }

    .card {
      position: relative;
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.2s;
      animation: cardIn 0.5s ease both;
    }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-2px);
    }

    /* Gradient top border */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(155,111,255,0.4), rgba(77,159,255,0.4), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover::before { opacity: 1; }

    /* Signal color accent on left */
    .card-accent {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 20px 0 0 20px;
    }
    .accent-buy { background: linear-gradient(180deg, var(--green), var(--green2)); }
    .accent-wait { background: linear-gradient(180deg, var(--red), #aa1144); }
    .accent-neutral { background: linear-gradient(180deg, var(--yellow), #cc9900); }
    .accent-nodata { background: var(--dim); }

    /* ── CARD BODY ── */
    .card-body {
      padding: 28px 32px 0 36px;
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 24px;
      align-items: start;
    }

    .product-name {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.3px;
      margin-bottom: 14px;
    }

    .price-block { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

    .price-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      line-height: 1;
      letter-spacing: 1px;
      transition: color 0.3s;
    }

    .change-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 4px;
    }
    .pill-down { background: rgba(13,255,159,0.1); color: var(--green); border: 1px solid rgba(13,255,159,0.2); }
    .pill-up   { background: rgba(255,45,107,0.1); color: var(--red);   border: 1px solid rgba(255,45,107,0.2); }
    .pill-flat { background: rgba(69,69,102,0.3);  color: var(--muted); border: 1px solid var(--dim); }

    .stats-row {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
    }

    /* CTA Button */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }
    .cta-btn:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
      transform: translateX(2px);
    }
    .cta-btn svg { transition: transform 0.2s; }
    .cta-btn:hover svg { transform: translateX(3px); }

    /* ── SIGNAL DIAL ── */
    .signal-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding-top: 4px;
    }

    .signal-outer {
      position: relative;
      width: 120px; height: 120px;
    }

    .signal-outer svg {
      position: absolute;
      inset: 0;
      animation: spinSlow 8s linear infinite;
    }
    @keyframes spinSlow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    .signal-inner {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
    }

    .signal-emoji { font-size: 30px; line-height: 1; }
    .signal-text {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }

    .signal-caption {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      max-width: 140px;
      line-height: 1.4;
    }

    /* ring colors */
    .ring-buy { stroke: var(--green); filter: drop-shadow(0 0 4px var(--green)); }
    .ring-wait { stroke: var(--red); filter: drop-shadow(0 0 4px var(--red)); }
    .ring-neutral { stroke: var(--yellow); filter: drop-shadow(0 0 4px var(--yellow)); }
    .ring-nodata { stroke: var(--dim); }

    .inner-buy { background: radial-gradient(circle, rgba(13,255,159,0.08) 0%, transparent 70%); }
    .inner-wait { background: radial-gradient(circle, rgba(255,45,107,0.08) 0%, transparent 70%); }
    .inner-neutral { background: radial-gradient(circle, rgba(255,204,0,0.08) 0%, transparent 70%); }
    .inner-nodata { background: transparent; }

    .text-buy { color: var(--green); }
    .text-wait { color: var(--red); }
    .text-neutral { color: var(--yellow); }
    .text-nodata { color: var(--muted); }

    /* ── CHART ── */
    .card-divider {
      height: 1px;
      margin: 24px 36px 0;
      background: var(--border);
    }

    .chart-wrap {
      padding: 16px 32px 24px 36px;
      height: 100px;
      position: relative;
    }

    .chart-label {
      position: absolute;
      top: 18px; right: 36px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .no-chart {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 36px;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--dim);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .card-body { grid-template-columns: 1fr; }
      .signal-wrap { flex-direction: row; align-items: center; }
      .price-value { font-size: 44px; }
      header { padding: 0 20px; }
      .card-body { padding: 24px 20px 0 24px; }
      .card-divider { margin: 20px 24px 0; }
      .chart-wrap { padding: 12px 20px 20px 24px; }
      .no-chart { margin: 0 24px; }
      .stats-row { gap: 14px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="logo-icon">💰</div>
    <div class="logo">PRICELOG</div>
    <div class="header-tag">PERSONAL</div>
  </div>
  <div class="header-right">
    <div class="updated-badge" id="updated-at">LIVE</div>
  </div>
</header>

<main>
  <div class="page-title">즐겨찾기 상품 가격 추적</div>
  <div class="cards" id="cards">
    <div style="padding:80px;text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px">LOADING...</div>
  </div>
</main>

<script>
const REPO_BASE = window.location.pathname.replace(/\/$/, '');

function fmt(p) { return Number(p).toLocaleString('ko-KR') + '원'; }

function getSignal(history) {
  if (history.length < 3) return { cls:'nodata', emoji:'📡', text:'TRACKING', caption:'데이터 수집 중이에요' };
  const prices = history.map(h => h.price);
  const curr = prices[prices.length-1];
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const avg = prices.reduce((a,b)=>a+b,0)/prices.length;
  if (max === min) return { cls:'neutral', emoji:'📊', text:'STABLE', caption:'가격 변동이 없어요' };
  const pos = (curr - min) / (max - min);
  if (curr <= min) return { cls:'buy', emoji:'🔥', text:'BUY NOW', caption:'역대 최저가예요!' };
  if (pos <= 0.2)  return { cls:'buy', emoji:'✅', text:'GO BUY', caption:'최저가 근처예요' };
  if (pos >= 0.8)  return { cls:'wait', emoji:'⛔', text:'WAIT', caption:'지금은 비싼 편이에요' };
  return { cls:'neutral', emoji:'🟡', text:'AVERAGE', caption:'평균 ' + fmt(Math.round(avg)) };
}

function getPriceChange(h) {
  if (h.length < 2) return null;
  const prev = h[h.length-2].price, curr = h[h.length-1].price;
  const diff = curr - prev;
  const pct = ((Math.abs(diff)/prev)*100).toFixed(1);
  return { diff, pct, cls: diff<0?'down':diff>0?'up':'flat' };
}

function makeDashedRing(cls) {
  const r = 46, cx = 48, cy = 48;
  const circ = 2 * Math.PI * r;
  return `<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke-width="1.5"
      stroke-dasharray="4 6" stroke-linecap="round"
      class="ring-${cls}" style="transform-origin:center"/>
  </svg>`;
}

function renderChart(id, history) {
  const canvas = document.getElementById(id);
  if (!canvas || history.length < 2) return;
  const prices = history.map(h => h.price);
  const min = Math.min(...prices);
  const curr = prices[prices.length-1];
  const isLow = curr <= min * 1.03;
  const col = isLow ? '#0dff9f' : curr >= Math.max(...prices)*0.92 ? '#ff2d6b' : '#9b6fff';

  new Chart(canvas, {
    type: 'line',
    data: {
      labels: history.map(h => h.date.slice(5,10)),
      datasets: [{
        data: prices,
        borderColor: col,
        borderWidth: 1.5,
        pointRadius: 0,
        pointHoverRadius: 5,
        pointHoverBackgroundColor: col,
        tension: 0.4,
        fill: true,
        backgroundColor: ctx => {
          const g = ctx.chart.ctx.createLinearGradient(0,0,0,100);
          g.addColorStop(0, col.replace('#','rgba(').replace('0dff9f','13,255,159,0.18)').replace('ff2d6b','255,45,107,0.18)').replace('9b6fff','155,111,255,0.18)'));
          g.addColorStop(1, 'rgba(0,0,0,0)');
          return g;
        }
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(13,13,21,0.9)',
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          titleFont: { family: 'JetBrains Mono', size: 10 },
          bodyFont: { family: 'JetBrains Mono', size: 12 },
          callbacks: { label: ctx => fmt(ctx.raw) }
        }
      },
      scales: {
        x: { display: false },
        y: { display: false, min: Math.min(...prices) * 0.965 }
      },
      interaction: { mode: 'index', intersect: false }
    }
  });
}

async function load() {
  const res = await fetch(REPO_BASE + '/data/prices.json?_=' + Date.now());
  const data = await res.json();

  let lastDate = '';
  data.products.forEach(p => {
    if (p.history.length > 0) {
      const d = p.history[p.history.length-1].date;
      if (d > lastDate) lastDate = d;
    }
  });
  if (lastDate) {
    document.getElementById('updated-at').textContent = 'UPDATED ' + lastDate;
  }

  const container = document.getElementById('cards');
  container.innerHTML = '';

  data.products.forEach((product, i) => {
    const h = product.history;
    const hasData = h.length > 0;
    const curr = hasData ? h[h.length-1].price : null;
    const prices = h.map(x => x.price);
    const minPrice = hasData ? Math.min(...prices) : null;
    const maxPrice = hasData ? Math.max(...prices) : null;
    const signal = getSignal(h);
    const change = getPriceChange(h);
    const cid = 'chart-' + i;

    let priceCol = 'var(--text)';
    if (signal.cls === 'buy') priceCol = 'var(--green)';
    if (signal.cls === 'wait') priceCol = 'var(--red)';

    let changePill = '';
    if (change) {
      const icon = change.diff < 0 ? '▼' : change.diff > 0 ? '▲' : '─';
      const pillCls = change.cls === 'down' ? 'pill-down' : change.cls === 'up' ? 'pill-up' : 'pill-flat';
      changePill = `<span class="change-pill ${pillCls}">${icon} ${change.pct}%</span>`;
    }

    const statsHtml = hasData ? `
      <div class="stats-row">
        ${minPrice != null ? `<div class="stat"><div class="stat-label">최저가</div><div class="stat-value">${fmt(minPrice)}</div></div>` : ''}
        ${maxPrice != null ? `<div class="stat"><div class="stat-label">최고가</div><div class="stat-value">${fmt(maxPrice)}</div></div>` : ''}
        <div class="stat"><div class="stat-label">수집</div><div class="stat-value">${h.length}회</div></div>
      </div>
    ` : '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-accent accent-${signal.cls}"></div>
      <div class="card-body">
        <div>
          <div class="product-name">${product.name}</div>
          <div class="price-block">
            ${hasData
              ? `<div class="price-value" style="color:${priceCol}">${fmt(curr)}</div>${changePill}`
              : `<div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);letter-spacing:1px">NO DATA YET</div>`
            }
          </div>
          ${statsHtml}
          <a class="cta-btn" href="${product.url}" target="_blank">
            쿠팡에서 보기
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3 7h8M7 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
        <div class="signal-wrap">
          <div class="signal-outer">
            ${makeDashedRing(signal.cls)}
            <div class="signal-inner inner-${signal.cls}">
              <div class="signal-emoji">${signal.emoji}</div>
              <div class="signal-text text-${signal.cls}">${signal.text}</div>
            </div>
          </div>
          <div class="signal-caption">${signal.caption}</div>
        </div>
      </div>
      <div class="card-divider"></div>
      ${h.length >= 2
        ? `<div class="chart-wrap"><div class="chart-label">PRICE HISTORY</div><canvas id="${cid}"></canvas></div>`
        : `<div class="no-chart">▸ 데이터가 쌓이면 그래프가 나타나요</div>`
      }
    `;
    container.appendChild(card);
    if (h.length >= 2) setTimeout(() => renderChart(cid, h), 0);
  });
}

load().catch(() => {
  document.getElementById('cards').innerHTML = '<div style="padding:80px;text-align:center;color:var(--muted);font-family:JetBrains Mono,monospace;font-size:11px;letter-spacing:2px">FAILED TO LOAD DATA</div>';
});
</script>
</body>
</html>
