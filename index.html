<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>pricelog</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pretendard:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0c0c12;
      --s1: #14141f;
      --s2: #1a1a28;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.15);
      --text: #ffffff;
      --text2: #c8c8e0;
      --muted: #7070a0;
      --green: #00ff9d;
      --green-bg: rgba(0,255,157,0.08);
      --green-border: rgba(0,255,157,0.25);
      --red: #ff3d71;
      --red-bg: rgba(255,61,113,0.08);
      --red-border: rgba(255,61,113,0.25);
      --yellow: #ffd60a;
      --yellow-bg: rgba(255,214,10,0.08);
      --yellow-border: rgba(255,214,10,0.25);
      --purple: #8b5cf6;
    }
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    body::before {
      content:'';
      position:fixed; inset:0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(139,92,246,0.06) 0%, transparent 100%);
      pointer-events:none; z-index:0;
    }

    /* ── HEADER ── */
    header {
      position:sticky; top:0; z-index:100;
      height:58px;
      display:flex; align-items:center;
      padding:0 32px;
      background:rgba(12,12,18,0.92);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
    }
    .logo {
      font-family:'Bebas Neue',sans-serif;
      font-size:24px; letter-spacing:3px;
      color:#fff;
    }
    .logo em { color:var(--purple); font-style:normal; }
    .badge {
      margin-left:10px;
      font-family:'JetBrains Mono',monospace;
      font-size:9px; letter-spacing:1.5px;
      padding:3px 8px;
      background:var(--s2);
      border:1px solid var(--border2);
      border-radius:4px;
      color:var(--muted);
    }
    .live-dot {
      margin-left:auto;
      display:flex; align-items:center; gap:7px;
      font-family:'JetBrains Mono',monospace;
      font-size:10px; color:var(--muted);
    }
    .dot {
      width:7px; height:7px; border-radius:50%;
      background:var(--green);
      box-shadow:0 0 8px var(--green);
      animation:blink 2.5s ease-in-out infinite;
    }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

    /* ── MAIN ── */
    main {
      max-width:920px; margin:0 auto;
      padding:40px 20px 80px;
      position:relative; z-index:1;
    }

    .section-title {
      font-size:11px; font-weight:600;
      letter-spacing:3px; text-transform:uppercase;
      color:var(--muted);
      margin-bottom:24px;
      display:flex; align-items:center; gap:14px;
    }
    .section-title::after {
      content:''; flex:1; height:1px;
      background:linear-gradient(90deg, var(--border2), transparent);
    }

    /* ── CARD ── */
    .cards { display:flex; flex-direction:column; gap:16px; }

    .card {
      background:var(--s1);
      border-radius:18px;
      border:1px solid var(--border);
      overflow:hidden;
      animation:fadeUp .4s ease both;
    }
    .card:nth-child(2){animation-delay:.08s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

    /* colored top line based on signal */
    .card-line {
      height:3px;
      background:var(--muted);
    }
    .card-line.buy  { background:linear-gradient(90deg,var(--green),#00cc78); }
    .card-line.wait { background:linear-gradient(90deg,var(--red),#cc2255); }
    .card-line.mid  { background:linear-gradient(90deg,var(--yellow),#cc9900); }

    .card-inner {
      padding:24px 28px 0;
    }

    /* top row: name + signal badge */
    .card-header {
      display:flex; align-items:flex-start;
      justify-content:space-between; gap:16px;
      margin-bottom:16px;
    }

    .product-name {
      font-size:17px; font-weight:700;
      color:var(--text2);
      line-height:1.3;
    }

    /* Signal badge - the main "cheap/expensive" indicator */
    .signal-badge {
      display:flex; align-items:center; gap:8px;
      padding:8px 16px;
      border-radius:100px;
      border:1px solid;
      white-space:nowrap;
      font-size:14px; font-weight:700;
      flex-shrink:0;
    }
    .signal-badge.buy {
      background:var(--green-bg);
      border-color:var(--green-border);
      color:var(--green);
    }
    .signal-badge.wait {
      background:var(--red-bg);
      border-color:var(--red-border);
      color:var(--red);
    }
    .signal-badge.mid {
      background:var(--yellow-bg);
      border-color:var(--yellow-border);
      color:var(--yellow);
    }
    .signal-badge.nodata {
      background:rgba(112,112,160,0.1);
      border-color:rgba(112,112,160,0.2);
      color:var(--muted);
    }
    .signal-icon { font-size:18px; }

    /* Price display */
    .price-row {
      display:flex; align-items:baseline; gap:12px;
      margin-bottom:4px;
    }
    .price-main {
      font-family:'Bebas Neue',sans-serif;
      font-size:54px; line-height:1;
      letter-spacing:1px;
    }
    .price-change {
      font-family:'JetBrains Mono',monospace;
      font-size:12px; font-weight:600;
      padding:3px 9px; border-radius:20px;
      margin-bottom:6px;
    }
    .price-change.down { background:var(--green-bg); color:var(--green); }
    .price-change.up   { background:var(--red-bg);   color:var(--red);   }

    /* ── PRICE GAUGE ── */
    .gauge-wrap {
      margin-top:20px;
    }
    .gauge-labels {
      display:flex; justify-content:space-between;
      margin-bottom:6px;
    }
    .gauge-label {
      font-family:'JetBrains Mono',monospace;
      font-size:10px; font-weight:600;
      letter-spacing:0.5px;
    }
    .gauge-label.min-label { color:var(--green); }
    .gauge-label.max-label { color:var(--red); }

    .gauge-track {
      position:relative;
      height:6px;
      background:var(--s2);
      border-radius:10px;
      overflow:visible;
    }
    .gauge-fill {
      position:absolute;
      left:0; top:0; height:100%;
      border-radius:10px;
      transition:width 1s cubic-bezier(.4,0,.2,1);
    }
    .gauge-thumb {
      position:absolute;
      top:50%;
      width:14px; height:14px;
      border-radius:50%;
      border:2px solid var(--bg);
      transform:translate(-50%, -50%);
      box-shadow:0 0 8px rgba(0,0,0,0.6);
      transition:left 1s cubic-bezier(.4,0,.2,1);
    }

    .gauge-sub {
      display:flex; justify-content:space-between;
      margin-top:8px;
    }
    .gauge-sub-item {
      font-size:12px; color:var(--muted); font-weight:500;
    }
    .gauge-sub-item strong { color:var(--text2); }

    /* ── STATS ── */
    .stats-row {
      display:flex; gap:0;
      margin-top:20px;
      background:var(--s2);
      border-radius:10px;
      overflow:hidden;
    }
    .stat {
      flex:1; padding:12px 16px;
      border-right:1px solid var(--border);
    }
    .stat:last-child { border-right:none; }
    .stat-label {
      font-family:'JetBrains Mono',monospace;
      font-size:9px; letter-spacing:1.5px;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:4px;
    }
    .stat-value {
      font-size:14px; font-weight:700;
      color:var(--text);
    }

    /* CTA */
    .cta-wrap { padding:16px 28px; }
    .cta-btn {
      display:inline-flex; align-items:center; gap:8px;
      background:#fee500;
      color:#000;
      font-size:13px; font-weight:700;
      padding:10px 20px;
      border-radius:10px;
      text-decoration:none;
      transition:opacity .15s, transform .15s;
    }
    .cta-btn:hover { opacity:.88; transform:translateX(2px); }

    /* ── CHART ── */
    .chart-section {
      border-top:1px solid var(--border);
      padding:16px 28px 22px;
    }
    .chart-title {
      font-family:'JetBrains Mono',monospace;
      font-size:9px; letter-spacing:2px;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:10px;
    }
    .chart-box { height:90px; }

    .disclosure {
      max-width:760px; margin:0 auto; padding:24px 20px 40px;
      text-align:center; font-size:11px; line-height:1.6;
      color:var(--muted);
    }

    .no-chart {
      border-top:1px solid var(--border);
      padding:20px 28px;
      font-size:12px; color:var(--muted);
      font-family:'JetBrains Mono',monospace;
      letter-spacing:1px;
    }

    @media(max-width:580px){
      .card-header { flex-direction:column; gap:10px; }
      .price-main { font-size:44px; }
      .stats-row { flex-wrap:wrap; }
      .stat { flex:1 1 40%; }
    }
  </style>
</head>
<body>
<header>
  <div class="logo">PRICE<em>LOG</em></div>
  <div class="badge">PERSONAL</div>
  <div class="live-dot">
    <div class="dot"></div>
    <span id="updated-at">LIVE</span>
  </div>
</header>

<main>
  <div class="section-title">즐겨찾기 상품</div>
  <div class="cards" id="cards">
    <div style="padding:60px;text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px">LOADING...</div>
  </div>
</main>

<footer class="disclosure">
  이 사이트는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
</footer>

<script>
const REPO_BASE = window.location.pathname.replace(/\/[^/]*\.html$/, '').replace(/\/$/, '');
// GitHub Pages에서는 자동 수집된 최신 데이터를 저장소에서 바로 읽어옵니다
const DATA_BASE = window.location.hostname.endsWith('.github.io')
  ? 'https://raw.githubusercontent.com/daeseji/pricelog/main/data'
  : REPO_BASE + '/data';
const fmt = p => Number(p).toLocaleString('ko-KR') + '원';

function getSignal(history) {
  if (history.length < 3) return { cls:'nodata', icon:'📡', text:'수집 중' };
  const prices = history.map(h=>h.price);
  const curr = prices[prices.length-1];
  const min = Math.min(...prices), max = Math.max(...prices);
  if (max===min) return { cls:'mid', icon:'😐', text:'변동 없음' };
  const pos = (curr-min)/(max-min);
  if (curr<=min) return { cls:'buy', icon:'🔥', text:'역대 최저가!' };
  if (pos<=0.25)  return { cls:'buy', icon:'✅', text:'살 타이밍' };
  if (pos>=0.75)  return { cls:'wait', icon:'⛔', text:'기다리세요' };
  return { cls:'mid', icon:'🟡', text:'보통 가격' };
}

function renderChart(id, history) {
  const canvas = document.getElementById(id);
  if (!canvas || history.length<2) return;
  const prices = history.map(h=>h.price);
  const curr = prices[prices.length-1];
  const min = Math.min(...prices);
  const col = curr<=min*1.03?'#00ff9d':curr>=Math.max(...prices)*0.9?'#ff3d71':'#8b5cf6';
  new Chart(canvas, {
    type:'line',
    data:{
      labels:history.map(h=>h.date.slice(5,10)),
      datasets:[{
        data:prices,
        borderColor:col, borderWidth:1.5,
        pointRadius:0, pointHoverRadius:4, tension:0.4, fill:true,
        backgroundColor:ctx=>{
          const g=ctx.chart.ctx.createLinearGradient(0,0,0,90);
          const a=col==='#00ff9d'?'0,255,157':col==='#ff3d71'?'255,61,113':'139,92,246';
          g.addColorStop(0,`rgba(${a},0.15)`);
          g.addColorStop(1,`rgba(${a},0)`);
          return g;
        }
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(20,20,31,0.95)',
          borderColor:'rgba(255,255,255,0.1)', borderWidth:1,
          titleColor:'#7070a0', bodyColor:'#fff',
          titleFont:{family:'JetBrains Mono',size:9},
          bodyFont:{family:'JetBrains Mono',size:13,weight:'600'},
          callbacks:{label:ctx=>fmt(ctx.raw)}
        }
      },
      scales:{
        x:{display:false},
        y:{display:false, min:Math.min(...prices)*0.965}
      },
      interaction:{mode:'index',intersect:false}
    }
  });
}

function buildGauge(prices, curr) {
  if (prices.length < 2) return '';
  const min = Math.min(...prices), max = Math.max(...prices);
  if (max === min) return '';
  const pos = Math.round(((curr-min)/(max-min))*100);
  const clampedPos = Math.max(2, Math.min(98, pos));

  // Gradient: green (cheap) → yellow → red (expensive)
  let thumbColor, fillColor;
  if (pos <= 25)      { thumbColor='#00ff9d'; fillColor='linear-gradient(90deg,#00ff9d,#00cc78)'; }
  else if (pos >= 75) { thumbColor='#ff3d71'; fillColor='linear-gradient(90deg,#00ff9d,#ffd60a,#ff3d71)'; }
  else                { thumbColor='#ffd60a'; fillColor='linear-gradient(90deg,#00ff9d,#ffd60a)'; }

  return `
    <div class="gauge-wrap">
      <div class="gauge-labels">
        <div class="gauge-label min-label">최저 ${fmt(min)}</div>
        <div class="gauge-label max-label">최고 ${fmt(max)}</div>
      </div>
      <div class="gauge-track" id="track-${curr}">
        <div class="gauge-fill" style="width:${clampedPos}%;background:${fillColor};opacity:0.4"></div>
        <div class="gauge-thumb" style="left:${clampedPos}%;background:${thumbColor};box-shadow:0 0 10px ${thumbColor}80"></div>
      </div>
      <div class="gauge-sub">
        <div class="gauge-sub-item">현재 위치 <strong>${pos <= 33 ? '저렴한 구간' : pos >= 67 ? '비싼 구간' : '중간 구간'}</strong></div>
        <div class="gauge-sub-item"><strong>${pos}%</strong> 위치</div>
      </div>
    </div>`;
}

// 제휴링크는 블로그와 같은 방식(go?u=Base64)으로 연결합니다
function productLink(product) {
  if (product.link_b64) return REPO_BASE + '/go.html?u=' + encodeURIComponent(product.link_b64);
  return product.url;
}

async function load() {
  const bust = '?_=' + Date.now();
  const [productsRes, pricesRes] = await Promise.all([
    fetch(DATA_BASE + '/products.json' + bust),
    fetch(DATA_BASE + '/prices.json' + bust),
  ]);
  const { products } = await productsRes.json();
  const { history = {} } = await pricesRes.json();
  products.forEach(p => { p.history = history[p.name] || []; });
  let lastDate = '';
  products.forEach(p => {
    if (p.history.length>0){ const d=p.history[p.history.length-1].date; if(d>lastDate)lastDate=d; }
  });
  if (lastDate) document.getElementById('updated-at').textContent = lastDate;

  const container = document.getElementById('cards');
  container.innerHTML = '';

  products.forEach((product, i) => {
    const h = product.history;
    const hasData = h.length > 0;
    const curr = hasData ? h[h.length-1].price : null;
    const prices = h.map(x=>x.price);
    const minPrice = hasData ? Math.min(...prices) : null;
    const maxPrice = hasData ? Math.max(...prices) : null;
    const avg = hasData ? Math.round(prices.reduce((a,b)=>a+b,0)/prices.length) : null;
    const signal = getSignal(h);
    const cid = 'chart-'+i;

    let priceColor = 'var(--text)';
    if (signal.cls==='buy') priceColor='var(--green)';
    if (signal.cls==='wait') priceColor='var(--red)';

    let changePill = '';
    if (h.length>=2) {
      const prev=h[h.length-2].price, c=h[h.length-1].price;
      const diff=c-prev, pct=((Math.abs(diff)/prev)*100).toFixed(1);
      const icon=diff<0?'▼':'▲', cls=diff<0?'down':'up';
      changePill=`<span class="price-change ${cls}">${icon} ${pct}%</span>`;
    }

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-line ${signal.cls}"></div>
      <div class="card-inner">
        <div class="card-header">
          <div class="product-name">${product.name}</div>
          <div class="signal-badge ${signal.cls}">
            <span class="signal-icon">${signal.icon}</span>
            <span>${signal.text}</span>
          </div>
        </div>

        ${hasData ? `
          <div class="price-row">
            <div class="price-main" style="color:${priceColor}">${fmt(curr)}</div>
            ${changePill}
          </div>
          ${buildGauge(prices, curr)}
          <div class="stats-row" style="margin-top:20px">
            <div class="stat">
              <div class="stat-label">최저가</div>
              <div class="stat-value" style="color:var(--green)">${fmt(minPrice)}</div>
            </div>
            <div class="stat">
              <div class="stat-label">평균가</div>
              <div class="stat-value">${avg ? fmt(avg) : '-'}</div>
            </div>
            <div class="stat">
              <div class="stat-label">최고가</div>
              <div class="stat-value" style="color:var(--red)">${fmt(maxPrice)}</div>
            </div>
            <div class="stat">
              <div class="stat-label">수집</div>
              <div class="stat-value">${h.length}회</div>
            </div>
          </div>
        ` : `<div style="padding:16px 0;color:var(--muted);font-size:13px">첫 데이터 수집 중이에요...</div>`}
      </div>
      <div class="cta-wrap">
        <a class="cta-btn" href="${productLink(product)}" target="_blank" rel="sponsored nofollow noopener">🛍 쿠팡에서 보기 →</a>
      </div>
      ${h.length>=2
        ? `<div class="chart-section"><div class="chart-title">가격 추이</div><div class="chart-box"><canvas id="${cid}"></canvas></div></div>`
        : `<div class="no-chart">▸ 데이터가 쌓이면 그래프가 나타나요</div>`
      }
    `;
    container.appendChild(card);
    if (h.length>=2) setTimeout(()=>renderChart(cid,h),0);
  });
}

load().catch(()=>{
  document.getElementById('cards').innerHTML='<div style="padding:60px;text-align:center;color:var(--muted)">데이터를 불러오지 못했어요</div>';
});
</script>
</body>
</html>
